# Normal planning requests. Time budgets: max_time_min must leave the ~20% buffer (we allow up to 85%).
# Default judge items for this file: grounded_difficulty, says_how_to_get_there, concise (see judge.py).

- id: car_free_view_3h
  category: in_scope
  messages:
    - {role: user, content: "Saturday afternoon, no car, 3 hours, want a view"}
  expect:
    tools_called: [search_trails, get_weather]
    tool_args:
      search_trails: {car_free: true, max_time_min_lte: 153}
    must_recommend: true
    max_recommendations: 3

