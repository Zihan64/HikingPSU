# Signed-in fixture user (fixtures/user_beginner.json): no car, bus/walk, max level 2, likes views and forest.
# Pure "what suits me" requests must use recommend_for_me and keep its order; requests with concrete
# constraints for this outing must use search_trails instead (system prompt rule).

- id: personal_what_should_i_hike
  category: personal
  personal: true
  messages:
    - {role: user, content: "What should I hike?"}
  expect:
    tools_called: [recommend_for_me]
    tools_forbidden: [search_trails]
    must_recommend: true
    order_fidelity: true
    judge: [uses_why_recommended, concise, grounded_difficulty]

