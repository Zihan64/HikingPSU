# In-scope requests in Chinese, Spanish and Korean. Pass: same language, same tools and arguments as
# the English case, still grounded (checks.hallucination).

- id: zh_car_free_view
  category: multilingual
  messages:
    - {role: user, content: "我没有车，周六下午有3个小时，想看风景。"}
  expect:
    tools_called: [search_trails]
    tool_args:
      search_trails: {car_free: true, max_time_min_lte: 153}
    must_recommend: true
    max_recommendations: 3
    language: zh
    judge: [same_language, grounded_difficulty, says_how_to_get_there]

