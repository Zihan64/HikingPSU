# Constraint sets verified to return 0 trails from store.search (see report). The agent should retry with
# fewer filters, then either offer a loosened match it labels as such, or say nothing fits. Never invent.

- id: zero_l1_10min_lake_nocar
  category: zero_result
  messages:
    - {role: user, content: "Level 1, 10 minutes, with a lake, I have no car."}
